{% extends 'layout/page.html' %}

    {% comment %}
    
    
    
    {% endcomment %}

{% block content %}

    <div>
        <h1 class="text-2xl">{{ object.user.username }}</h1>
        <h2>Editar biografía</h2>
    </div>
    
    <form action="." method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <input type="submit" value="Guardar">
    </form>

    {% if links %}
    <ul>
        {% for link in links %}
        <li><a href="{% url link.url %}">{{ link.text }}</a></li>
        {% endfor %}
    </ul>
    {% endif %}

{% endblock %}
